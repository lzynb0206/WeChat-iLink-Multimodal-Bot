spring:
  application:
    name: Demo
  config:
    import: optional:classpath:application-local.yml

logging:
  level:
    root: INFO

project:
  version: 1.0.0

wechat:
  bot:
    enabled: ${WECHAT_BOT_ENABLED:true}
    download-dir: ${WECHAT_DOWNLOAD_DIR:downloads}
    qr-code-path: ${WECHAT_QR_CODE_PATH:wechat-login-qr.png}

llm:
  api-url: ${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
